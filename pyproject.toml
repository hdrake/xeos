[project]
name = "xeos"
dynamic = ["version"]
authors = [
    {name="Henri F. Drake", email="hfdrake@uci.edu"},
]
description = "xarray-enabled wrappers for various Equations of State of seawater"
keywords = [
    "oceanography",
    "ocean modeling",
    "water mass transformation",
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
# Core runtime is deliberately lightweight: the polynomial/rational EOS are
# vendored as numpy kernels, so only numpy + xarray are required. Heavier
# backends (TEOS-10 via gsw) and acceleration (numba) are opt-in extras.
dependencies = [
    "numpy",
    "xarray",
]

[project.optional-dependencies]
# Full TEOS-10 (gsw is itself lightweight; only depends on numpy).
teos10 = ["gsw"]
# Everything an end user might want: full TEOS-10 (gsw) plus numba acceleration.
# Advertised in the README as `pip install xeos[complete]`.
complete = ["gsw", "numba"]
# Test deps: pytest + gsw (so the TEOS-10 cases run) + dask (exercises the
# dask-parallelized path). The reference packages that produce the frozen
# fixtures are NOT here — see xeos/tests/reference/README.md.
test = ["pytest", "gsw", "dask", "hypothesis", "numba"]

[project.urls]
"Homepage" = "https://github.com/hdrake/xeos"
"Bugs/Issues/Features" = "https://github.com/hdrake/xeos/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version comes from the git tag, not from a file in the tree. Releasing is
# then a single act -- tag `vX.Y.Z` and publish the GitHub Release -- with no
# second commit that has to be remembered, and no way for the tag and the built
# artifact to disagree. (They did disagree once: v0.2.1 was tagged one commit
# before the version bump, so the build produced 0.2.0 artifacts and PyPI
# rejected them as duplicates.)
[tool.hatch.version]
source = "vcs"

# Drop the `+g<sha>` local segment. On a clean tag the version is exactly X.Y.Z
# either way, but an untagged build would otherwise carry a PEP 440 *local*
# version, which package indexes refuse outright -- that would silently break
# the workflow_dispatch -> TestPyPI rehearsal path, whose whole job is to catch
# problems before a real release. Untagged builds are `X.Y.Z.devN` instead.
[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

# Building writes the resolved version to `xeos/_version.py`, which is gitignored
# but *is* included in the sdist -- so `pip install` from the sdist, and
# conda-forge's build from the PyPI sdist, both work without git present.
[tool.hatch.build.hooks.vcs]
version-file = "xeos/_version.py"

[tool.hatch.build]
# Never ship the third-party reference code that generate_truth.py downloads
# on demand (only the frozen truth.json it produces is distributed).
exclude = ["examples/**", "data/**", "docs/**", "**/reference/polyTEOS10.py"]