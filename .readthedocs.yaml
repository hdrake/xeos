# Read the Docs configuration. Builds the Sphinx docs (including the executed
# MITgcm example notebook) for every branch and every pull request, so each PR
# gets a clickable "docs/readthedocs.org:xeos" check that opens the rendered docs
# in the browser.
#
# One-time setup by a maintainer (mirrors what xgcm does):
#   1. Import the repo at https://readthedocs.org/dashboard/import/ (sign in with
#      GitHub, pick hdrake/xeos).
#   2. In the project's Admin -> Settings, enable "Build pull requests for this
#      project" so PRs get preview builds.
# No token wrangling is needed; RTD reads this file from the branch under test.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # RTD clones shallow, but `.[teos10]` resolves its version from the git tag
      # via hatch-vcs. Without the tag the docs get titled with a `.devN+g<sha>`
      # version instead of the release. Tolerate failure: an already-complete
      # clone makes `--unshallow` an error, which must not fail the build.
      - git fetch --unshallow || true
      - git fetch --tags || true

sphinx:
  configuration: docs/conf.py
  # Match CI strictness: warnings fail the build (the notebook must execute cleanly).
  fail_on_warning: true

python:
  install:
    # Installs the docs toolchain AND `.[teos10]` (xeos + gsw) from the repo root.
    - requirements: docs/requirements.txt
