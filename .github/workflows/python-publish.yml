# Build and publish xeos to PyPI using PyPI Trusted Publishing (OIDC).
#
# No API token / password secret is used: the `publish` job authenticates to
# PyPI over OpenID Connect via `pypa/gh-action-pypi-publish`, gated by the
# GitHub `pypi` environment. See conda/README.md and PyPI's "Trusted Publishers"
# settings for the one-time configuration the maintainer must do on PyPI before
# the first publish succeeds.
#
# Triggers:
#   * release: published  -> build + publish to PyPI
#   * workflow_dispatch   -> build (+ optional TestPyPI publish) on demand

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Also publish the build to TestPyPI"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from the git tag, which a shallow
          # clone does not have. Without this the build silently produces a
          # `0.0.0.dev...` artifact instead of the release version.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check --strict dist/*

      # The version now comes from the tag, so this should be unfalsifiable --
      # but it is the last point at which a mismatch is cheap to see. Without
      # it, the symptom is a 400 from PyPI at the very end of the release, and
      # only if that version happens to already exist.
      - name: Built version must match the release tag
        if: github.event_name == 'release'
        run: |
          built=$(ls dist/*.tar.gz | sed -E 's|.*/xeos-(.*)\.tar\.gz|\1|')
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag built=$built"
          if [ "$built" != "$tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME implies version '$tag', but the build produced '$built'."
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    # Only publish to PyPI on an actual GitHub Release.
    if: github.event_name == 'release'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xeos
    permissions:
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    # Opt-in dry-run path: trigger via "Run workflow" and tick the `testpypi`
    # box. Requires a separate Trusted Publisher configured on
    # https://test.pypi.org and a GitHub environment named `testpypi`.
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/xeos
    permissions:
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
